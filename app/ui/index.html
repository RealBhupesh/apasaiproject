<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APAS V3</title>
<style>
:root{color-scheme:dark;--bg:#070b12;--panel:#101722;--line:#263346;--text:#e8eef8;--muted:#8fa2bb;--accent:#6ee7c7;--warn:#f7c66b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#132337,var(--bg) 38%);font:14px Inter,system-ui;color:var(--text)}main{max-width:1180px;margin:auto;padding:34px 20px}h1{font-size:30px;margin:0}header p{color:var(--muted)}.tag{color:var(--accent);letter-spacing:.12em;font-weight:700}.panel{background:rgba(16,23,34,.93);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px;box-shadow:0 20px 50px #0005}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}label{color:var(--muted);display:grid;gap:7px}select,input,textarea,button{font:inherit;color:var(--text);background:#0b111b;border:1px solid var(--line);border-radius:9px;padding:11px}textarea{width:100%;min-height:100px;margin-top:12px}button{background:var(--accent);color:#05231d;font-weight:800;cursor:pointer;margin-top:12px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{white-space:pre-wrap}.status{font-size:18px;color:var(--accent)}pre{overflow:auto;color:#bcd0e9;background:#080d14;padding:12px;border-radius:9px}.muted{color:var(--muted)}@media(max-width:760px){.grid,.cards{grid-template-columns:1fr}}
</style></head><body><main><header><div class="tag">DEFENSIBLE GRAPHRAG / V4</div><h1>Evidence before generation.</h1><p>Server-bound demo identities; tenant and clearance cannot be supplied by the model. <a href="/review-console">Human review console</a></p></header>
<section class="panel"><div class="grid"><label>Demo identity<select id="identity"><option>alpha-viewer</option><option selected>alpha-analyst</option><option>alpha-admin</option><option>alpha-agent</option><option>beta-analyst</option></select></label><label>Jurisdiction<select id="jurisdiction"><option>FEDERAL</option><option>STATE-X</option></select></label><label>As-of date<input id="date" type="date" value="2026-06-01"></label></div><textarea id="question">When must Alpha facilities report a sample result?</textarea><button onclick="ask()">Run secure workflow</button><p id="error" class="muted"></p></section>
<section id="output" hidden><div class="panel"><div id="status" class="status"></div><h2>Final answer</h2><div id="answer" class="result"></div><p id="confidence" class="muted"></p></div><div class="cards"><div class="panel"><h3>Claims & verification</h3><pre id="claims"></pre></div><div class="panel"><h3>Evidence</h3><pre id="evidence"></pre></div><div class="panel"><h3>Security decisions</h3><pre id="security"></pre></div><div class="panel"><h3>Trace & provenance handles</h3><pre id="trace"></pre></div></div></section>
<script>const show=(id,v)=>document.getElementById(id).textContent=typeof v==='string'?v:JSON.stringify(v,null,2);async function ask(){show('error','Running…');document.getElementById('output').hidden=true;const body={question:question.value,identity:identity.value,jurisdiction:jurisdiction.value,as_of_date:date.value};const r=await fetch('/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){show('error',d.detail||'Denied');return}show('error','');document.getElementById('output').hidden=false;show('status',d.disposition);show('answer',d.answer);show('confidence',`Confidence: ${Math.round(d.confidence*100)}% • Audit event: ${d.audit_event_id} • Evidence package: ${d.evidence_package_id||"none"} • Classification: ${d.answer_classification}`);show('claims',{claims:d.claims,verification:d.verification,conflicts:d.conflicts,temporal_reasoning:d.temporal_reasoning});show('evidence',{passages:d.evidence,graph_relations:d.graph_relations});show('security',d.security_decisions);show('trace',d.trace)}</script></main></body></html>
