<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APAS Review Console</title><style>:root{color-scheme:dark;--bg:#070b12;--p:#101722;--l:#29364a;--a:#6ee7c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8eef8;font:14px system-ui}main{max-width:1100px;margin:auto;padding:32px}.bar,.case{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:18px;margin-bottom:14px}select,input,textarea,button{background:#090f18;color:#e8eef8;border:1px solid var(--l);border-radius:8px;padding:10px}button{background:var(--a);color:#05231d;font-weight:800}.evidence{display:grid;grid-template-columns:1fr 1fr;gap:10px}pre{overflow:auto;white-space:pre-wrap}.tag{color:var(--a);font-weight:800}</style></head><body><main><h1>Human escalation console</h1><p>Conflict dossiers remain classified and tenant-scoped. High-risk decisions require two distinct reviewers.</p><div class="bar"><select id="identity"><option>alpha-admin</option></select><input id="bearer" type="password" autocomplete="off" placeholder="Production Bearer token" style="display:none"><button onclick="load()">Load reviews</button></div><div id="cases"></div></main><script>let runtimeMode="demo";function authHeaders(){return runtimeMode==="demo"?{"x-demo-identity":identity.value}:{authorization:"Bearer "+bearer.value}}async function load(){const r=await fetch('/reviews',{headers:authHeaders()});const d=await r.json();cases.innerHTML=(d.reviews||[]).map(c=>`<section class="case"><div class="tag">${c.status}</div><h2>${c.reason}</h2><p>Request ${c.request_id} • Classification ${c.classification}</p><div class="evidence"><pre>${JSON.stringify(c.conflict,null,2)}</pre><pre>${JSON.stringify(c.evidence||c.evidence_ids,null,2)}</pre></div><textarea id="r-${c.id}" placeholder="Reviewer rationale"></textarea><button onclick="decide('${c.id}','APPROVED')">Approve</button> <button onclick="decide('${c.id}','REJECTED')">Reject</button></section>`).join('')||'<p>No authorized reviews.</p>'}async function decide(id,decision){const rationale=document.getElementById('r-'+id).value;const body={decision,rationale};if(runtimeMode==="demo")body.identity=identity.value;const r=await fetch('/reviews/'+id+'/decision',{method:'POST',headers:{'content-type':'application/json',...authHeaders()},body:JSON.stringify(body)});alert(JSON.stringify(await r.json(),null,2));load()}fetch('/health').then(r=>r.json()).then(h=>{runtimeMode=h.runtime_mode;if(runtimeMode==='production'){identity.style.display='none';bearer.style.display='inline-block'}})</script></body></html>
