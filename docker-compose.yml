services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: apas
      POSTGRES_USER: apas_migration_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apas_migration_admin -d apas"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/db/migrations/001_v3.sql:/docker-entrypoint-initdb.d/001_v3.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://apas_api_reader:${APP_DB_PASSWORD:-local-reader}@postgres:5432/apas
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
volumes: {pgdata: {}}
