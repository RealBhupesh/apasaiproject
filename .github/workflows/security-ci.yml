name: security-ci
on: [push, pull_request]
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: apas}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d apas" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - name: Migrate, seed, and provision non-owner runtimes
        env: {PGPASSWORD: postgres}
        run: |
          psql -h localhost -U postgres -d apas -f app/db/migrations/001_v3.sql
          psql -h localhost -U postgres -d apas -f app/db/migrations/002_v4_hardening.sql
          psql -h localhost -U postgres -d apas -f app/db/migrations/003_runtime_enforcement.sql
          psql -h localhost -U postgres -d apas -f scripts/seed_postgres.sql
          psql -h localhost -U postgres -d apas <<'SQL'
          CREATE ROLE apas_api_runtime LOGIN PASSWORD 'ci-api' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS;
          CREATE ROLE apas_auth_runtime LOGIN PASSWORD 'ci-auth' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS;
          CREATE ROLE apas_ingestion_runtime LOGIN PASSWORD 'ci-ingest' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS;
          CREATE ROLE apas_audit_runtime LOGIN PASSWORD 'ci-audit' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOBYPASSRLS;
          GRANT apas_api_reader,apas_api_writer TO apas_api_runtime;
          GRANT apas_auth_reader TO apas_auth_runtime;
          GRANT apas_ingestion_worker TO apas_ingestion_runtime;
          GRANT apas_audit_writer TO apas_audit_runtime;
          SQL
      - run: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://apas_api_runtime:ci-api@localhost:5432/apas
          TEST_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/apas
          TEST_AUTH_DATABASE_URL: postgresql+psycopg://apas_auth_runtime:ci-auth@localhost:5432/apas
      - run: python scripts/evaluate.py
      - run: ruff check app tests scripts --select F,E9
